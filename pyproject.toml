[project]
name = "tts"
version = "0.1.0"
description = "Convert EPUB e-books to M4B audiobooks via Fish Speech S2 Pro"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "chonkie>=1.6.1",
    "ebooklib>=0.20",
    "ffmpeg-python>=0.2",
    "httpx>=0.27",
    "nemo-text-processing>=1.1.0",
    "numpy>=1.26",
    "soundfile>=0.13.1",
    "typer>=0.24.1",
]
