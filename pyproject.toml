[project]
name = "tts"
version = "0.1.0"
description = "Convert EPUB e-books to M4B audiobooks via Fish Speech S2 Pro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14",
    "chonkie>=1.6",
    "ebooklib>=0.20",
    "ffmpeg-python>=0.2",
    "lxml>=6.0.2",
    "mutagen>=1.47",
    "nest-asyncio>=1.6",
    "numpy>=2.4",
    "Pillow>=12.1",
    "soundfile>=0.13",
    "typer>=0.24",
]
