[project]
name = "epub2audiobook"
version = "0.1.0"
description = "Convert EPUB e-books to M4B audiobooks via Chatterbox TTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chatterbox-tts>=0.1.6",
    "beautifulsoup4>=4.13",
    "ebooklib>=0.20",
    "ffmpeg-python>=0.2",
    "numpy",
    "soundfile>=0.13.1",
    "torchaudio",
    "typer>=0.12",
]

[project.scripts]
epub2audiobook = "src.main:app"
