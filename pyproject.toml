[project]
name = "epub2audiobook"
version = "0.1.0"
description = "Convert EPUB e-books to M4B audiobooks via Chatterbox TTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chatterbox-tts>=0.1.6",
    "beautifulsoup4>=4.14",
    "ebooklib>=0.20",
    "ffmpeg-python>=0.2",
    "lxml>=6.0",
    "mutagen>=1.47",
    "soundfile>=0.13.1",
    "typer>=0.24",
    "onnx<1.19",
    "torchaudio",
    "chonkie",
    "numpy",
    "Pillow",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
